<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login de Colaborador - ACMais</title>
    <style>
        :root {
            --ciano: #6DD8E8;
            --ciano-dark: #3bbdd0;
            --roxo: #7B5EA7;
            --bg-body: #0a0a0f;
            --bg-card: rgba(20, 20, 32, 0.7);
            --border-color: rgba(255, 255, 255, 0.08);
            --text-main: #f5f5fa;
            --text-muted: #9ca3af;
        }

        [data-theme="light"] {
            --bg-body: #f7f8fa;
            --bg-card: #ffffff;
            --border-color: rgba(0, 0, 0, 0.08);
            --text-main: #333333;
            --text-muted: #666666;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-body);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            transition: background-color 0.3s, color 0.3s;
        }

        .login-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            backdrop-filter: blur(16px);
            border-radius: 16px;
            padding: 40px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
            box-sizing: border-box;
            position: relative;
        }

        .theme-toggle-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 6px;
            border-radius: 6px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .theme-toggle-btn:hover {
            background: rgba(123, 94, 167, 0.1);
        }

        .login-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo-img {
            height: 48px;
            width: auto;
            margin-bottom: 12px;
        }

        .subtitle {
            color: var(--text-muted);
            font-size: 0.9rem;
            font-weight: 600;
        }

        .form-group {
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        label {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-main);
        }

        input {
            background: rgba(10, 10, 15, 0.05);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 12px 16px;
            color: var(--text-main);
            font-size: 0.95rem;
            transition: all 0.2s;
            box-sizing: border-box;
            width: 100%;
        }

        [data-theme="dark"] input {
            background: rgba(10, 10, 15, 0.6);
            color: #fff;
        }

        input:focus {
            outline: none;
            border-color: var(--ciano);
            box-shadow: 0 0 8px rgba(109, 216, 232, 0.2);
        }

        .btn-submit {
            background: linear-gradient(135deg, var(--ciano), var(--ciano-dark));
            color: #05050a;
            border: none;
            padding: 14px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
            transition: all 0.2s;
        }

        .btn-submit:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 16px rgba(109, 216, 232, 0.4);
        }

        .error-msg {
            background: rgba(239, 68, 68, 0.1);
            color: #ef4444;
            border: 1px solid rgba(239, 68, 68, 0.2);
            padding: 12px;
            border-radius: 8px;
            font-size: 0.85rem;
            text-align: center;
            display: none;
            margin-bottom: 20px;
        }

        .back-home {
            text-align: center;
            margin-top: 24px;
            font-size: 0.85rem;
        }

        .back-home a {
            color: var(--text-muted);
            text-decoration: none;
            transition: color 0.2s;
        }

        .back-home a:hover {
            color: var(--ciano);
        }
    </style>
</head>
<body>

    <div class="login-card">
        <button id="theme-toggle" class="theme-toggle-btn" aria-label="Alternar tema">
            <span id="theme-icon">🌙</span>
        </button>

        <div class="login-header">
            <img id="theme-logo" class="logo-img" src="./img/logo ACMAIS CCBPOE Light.png" alt="ACMais Logo">
            <div class="subtitle">Área do Colaborador</div>
        </div>

        <div class="error-msg" id="errorMsg">E-mail ou senha incorretos.</div>

        <form id="collabLoginForm">
            <div class="form-group">
                <label for="email">E-mail de Trabalho</label>
                <input type="email" id="email" required placeholder="nome@acmais.com.br">
            </div>

            <div class="form-group">
                <label for="password">Senha</label>
                <input type="password" id="password" required placeholder="••••••••">
            </div>

            <button type="submit" class="btn-submit" id="submitBtn">Entrar no Portal</button>
        </form>

        <div class="back-home">
            <a href="/">← Voltar ao site principal</a>
        </div>
    </div>

    <script>
        // Theme management
        function initTheme() {
            const savedTheme = localStorage.getItem('acmais_theme') || 'dark';
            document.documentElement.setAttribute('data-theme', savedTheme);
            updateThemeUI(savedTheme);
        }

        function toggleTheme() {
            const currentTheme = document.documentElement.getAttribute('data-theme') || 'dark';
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', newTheme);
            localStorage.setItem('acmais_theme', newTheme);
            updateThemeUI(newTheme);
        }

        function updateThemeUI(theme) {
            const icon = document.getElementById('theme-icon');
            const logo = document.getElementById('theme-logo');
            if (theme === 'light') {
                icon.textContent = '☀️';
                logo.src = './img/logo ACMAIS CCBPOE Dark.png';
            } else {
                icon.textContent = '🌙';
                logo.src = './img/logo ACMAIS CCBPOE Light.png';
            }
        }

        document.getElementById('theme-toggle').addEventListener('click', toggleTheme);
        initTheme();

        document.getElementById('collabLoginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const errorMsg = document.getElementById('errorMsg');
            const submitBtn = document.getElementById('submitBtn');

            submitBtn.disabled = true;
            submitBtn.textContent = 'Autenticando...';
            errorMsg.style.display = 'none';

            try {
                const response = await fetch('/api/colaborador/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                
                const data = await response.json();
                if (data.success) {
                    window.location.href = data.redirect;
                } else {
                    errorMsg.textContent = data.message || 'Erro ao realizar login.';
                    errorMsg.style.display = 'block';
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'Entrar no Portal';
                }
            } catch (err) {
                console.error(err);
                errorMsg.textContent = 'Erro ao se conectar ao servidor.';
                errorMsg.style.display = 'block';
                submitBtn.disabled = false;
                submitBtn.textContent = 'Entrar no Portal';
            }
        });
    </script>
</body>
</html>
