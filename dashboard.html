<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Área do Cliente - ACMais</title>
    <link rel="stylesheet" href="public/css/style.css">
    <style>
        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-body, #0a0a0a);
            color: var(--text-main, #f5f5f5);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }
        .dashboard-container {
            background: rgba(30, 30, 30, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-radius: 12px;
            padding: 40px;
            text-align: center;
            max-width: 600px;
            width: 90%;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }
        h1 {
            color: var(--ciano, #00d2ff);
            margin-bottom: 20px;
        }
        p {
            margin-bottom: 30px;
            line-height: 1.6;
            color: var(--text-muted, #a0a0a0);
        }
        .btn-logout {
            background: linear-gradient(135deg, #ff4b4b, #d10000);
            color: #fff;
            border: none;
            padding: 12px 24px;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            font-size: 1rem;
        }
        .btn-logout:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(255, 75, 75, 0.3);
        }
    </style>
</head>
<body>
    <div class="dashboard-container">
        <h1>Bem-vindo à Área do Cliente</h1>
        <p>Esta é uma área segura. Apenas usuários autenticados com uma sessão válida podem acessar este painel.</p>
        <p>Aqui estarão disponíveis relatórios financeiros, documentos contábeis e contato direto com nossos especialistas.</p>
        <button class="btn-logout" id="logoutBtn">Sair da Conta</button>
    </div>

    <script>
        document.getElementById('logoutBtn').addEventListener('click', async () => {
            try {
                const response = await fetch('/api/logout', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' }
                });
                
                const data = await response.json();
                if(data.success) {
                    window.location.href = data.redirect;
                } else {
                    alert('Erro ao sair: ' + data.message);
                }
            } catch (error) {
                console.error('Erro na requisição de logoff', error);
                alert('Ocorreu um erro ao tentar sair.');
            }
        });
    </script>
</body>
</html>
